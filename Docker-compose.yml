services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: server-manager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    networks:
      - server-manager-net

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: server-manager-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - server-manager-net

networks:
  server-manager-net:
    driver: bridge
